# The Lounge (this fork), run from the image published by CI.
#
# Ingress is handled by a cloudflared tunnel running ON THE HOST, so this stack
# exposes nothing publicly: the port is bound to loopback only, and the host's
# cloudflared routes your hostname -> http://localhost:9000.
#
# reverseProxy=true tells The Lounge to trust the forwarded headers.
# See ./README.md for setup and updates.

services:
  thelounge:
    image: ghcr.io/eggsampler/thelounge:latest
    container_name: thelounge
    restart: unless-stopped
    # Raise Node's Happy-Eyeballs per-address attempt timeout (default 250ms) so
    # high-RTT links don't fail the connect to single-address IRC servers before
    # one round trip completes (shows up as "AggregateError" / ETIMEDOUT).
    entrypoint: ["node", "--network-family-autoselection-attempt-timeout=3000", "index.js"]
    # host=0.0.0.0 forces listening on all interfaces inside the container so the
    # published port works even if a restored config.js pins host to 127.0.0.1.
    command: ["-c", "reverseProxy=true", "-c", "host=0.0.0.0", "start"]
    ports:
      - "127.0.0.1:9000:9000" # loopback only; reached by the host's cloudflared
    volumes:
      - thelounge-data:/var/opt/thelounge

volumes:
  thelounge-data:
